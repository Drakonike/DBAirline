plugins {
    id 'java'
    id 'application'
    id 'org.javamodularity.moduleplugin' version '1.8.12'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group 'org.application'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

application {
    mainModule = 'org.application.dbairline'
    mainClass = 'org.application.dbairline.Launcher'
}

javafx {
    version = '17'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation('mysql:mysql-connector-java:8.0.28')
}

mainClassName = 'org.application.dbairline.Launcher'

